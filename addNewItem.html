<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Items | Billing System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="header-content">
            <h2>Manage Items</h2>
            <div class="flex-row">
                <a class="page-link" href="index.html">Back to Billing</a>
                <button type="button" id="openPriceFile" class="bill-btn">
                    Select price.json
                </button>
            </div>
        </div>
    </header>

    <main class="item-manager">
        <section class="item-manager-card">
            <h2>Product List</h2>
            <p id="itemStatus" class="item-status" role="status" aria-live="polite">
                Loading items...
            </p>

            <div class="transaction-table-wrapper">
                <table id="itemsTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>ID</th>
                            <th>Item Name</th>
                            <th>Price</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="itemsBody">
                        <tr>
                            <td colspan="4">Select price.json to view items.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="item-manager-card add-item-section ">
            <h2 id="itemFormTitle">Add Item</h2>
            <form id="itemForm">
                <label for="itemName">Item name</label>
                <input type="text" id="itemName" name="name" required maxlength="120">

                <label for="itemPrice">Price (₹)</label>
                <input type="number" id="itemPrice" name="price" required min="0" step="0.01">

                <div class="item-form-buttons">
                    <button type="submit" id="saveItem" class="bill-btn" disabled>
                        Add Item
                    </button>
                    <button type="button" id="cancelEdit" class="clear-btn" hidden>
                        Cancel Edit
                    </button>
                </div>
            </form>
        </section>
    </main>

    <div id="confirmPopup" class="popup-overlay">
        <div class="popup-box">
            <h2>Delete Item?</h2>
            <p>Are you sure you want to remove items?</p>

            <div class="popup-buttons">
                <button class="cancel-btn" onclick="closePopup()">
                    Cancel
                </button>

                <button class="confirm-btn" onclick="confirmRemoveItem()">
                    Yes, Remove Item
                </button>
            </div>
        </div>
    </div>

    <script src="addNewItem.js"></script>
</body>

</html>
