
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Billing System</h1>
    <p>Product Billing & Invoice Generator</p>
</header>

<div class="container">

    <!-- Products Section -->
    <section class="products">
        <h2>Available Items</h2>

        <input
            type="text"
            id="search"
            placeholder="Search products..."
        >

        <div id="productList" class="product-list">
            Loading products...
        </div>
    </section>

    <!-- Cart Section -->
    <section class="cart">
        <h2>Shopping Cart</h2>

        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Price</th>
                    <th>Qty</th>
                    <th>Total</th>
                    <th>Remove</th>
                </tr>
            </thead>
            <tbody id="cartItems"></tbody>
        </table>

        <div class="total-section">
            <h3>
                Grand Total:
                ₹<span id="grandTotal">0.00</span>
            </h3>
        </div>

        <button onclick="generateBill()" class="bill-btn">
            Generate Bill
        </button>

        <button onclick="clearCart()" class="clear-btn">
            Clear Cart
        </button>
    </section>

</div>


<!-- Custom Confirmation Popup -->
<div id="confirmPopup" class="popup-overlay">
    <div class="popup-box">
        <h2>Clear Cart?</h2>
        <p>Are you sure you want to remove all items from your cart?</p>

        <div class="popup-buttons">
            <button class="cancel-btn" onclick="closePopup()">
                Cancel
            </button>

            <button class="confirm-btn" onclick="confirmClearCart()">
                Yes, Clear Cart
            </button>
        </div>
    </div>
</div>


<!-- Invoice Section -->
<div id="invoice" class="invoice"></div>

<script src="index.js"></script>
</body>
</html>
